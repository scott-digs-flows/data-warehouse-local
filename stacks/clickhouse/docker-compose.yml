# ClickHouse stack — self-contained. One container, no object store, no catalog.
#
# Data lives in ClickHouse's own MergeTree tables, loaded from the shared raw
# layer (shared/data + shared/schemas) by load.py. Nothing here talks to any
# other stack.
#
#   cp .env.example .env
#   docker compose up -d
#   uv run python load.py
#
# The native protocol is published on 9010 rather than 9000, purely so this
# stack can run alongside the Iceberg stack's MinIO without a port clash.

name: dwl-clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7.3.19
    container_name: dwl-clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9010}:9000"
      - "${CLICKHOUSE_PGWIRE_PORT:-9005}:9005"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config.d:/etc/clickhouse-server/config.d:ro
      - ./users.d:/etc/clickhouse-server/users.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "${CLICKHOUSE_PASSWORD:-clickhouse}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clickhouse_data:
