[project]
name = "data-warehouse-local"
version = "0.1.0"
description = "Local Iceberg lake + multi-engine query endpoints, backing a custom BI app POC."
requires-python = ">=3.11"
dependencies = [
    "pyiceberg[s3fs,pyarrow]>=0.8.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.5.0",
    "requests>=2.32.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    # Engine clients — the same drivers the BI app will use.
    "trino>=0.330.0",
    "clickhouse-connect>=0.8.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
duckdb-api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]
# Only needed for the parked loader-comparison experiment.
experiments = [
    "datafusion>=43.1.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
package = false
