# Local lakehouse stack backing the BI-app POC.
#
# One Iceberg lake (MinIO + Lakekeeper), several engines reading it:
#   Trino / DuckDB / ClickHouse read Iceberg in place (zero copy).
#   Postgres receives a synced copy (see scripts/sync_postgres.py).
#
# Profiles:
#   default   -> minio, postgres, lakekeeper  (everything the loader needs)
#   engines    -> trino, duckdb-api, clickhouse
#   all        -> shorthand for everything
#
# Examples:
#   docker compose up -d                        # lake only
#   docker compose --profile engines up -d      # lake + query engines
#
# All credentials come from .env — see .env.example. Nothing is hardcoded here.

services:
  # ============================================================
  # Object storage (MinIO, S3-compatible)
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [warehouse-net]

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-admin12345} &&
      mc mb -p local/${MINIO_BUCKET:-warehouse} &&
      echo 'MinIO bucket ready: ${MINIO_BUCKET:-warehouse}';
      "
    networks: [warehouse-net]

  # ============================================================
  # Postgres
  #   db `lakekeeper` -> Iceberg catalog metadata
  #   db `analytics`  -> synced copy of the lake (Tier-2 engine)
  # ============================================================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakekeeper}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakekeeper}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [warehouse-net]

  # ============================================================
  # Lakekeeper Iceberg REST catalog
  # ============================================================
  lakekeeper-migrate:
    image: &lakekeeper-image quay.io/lakekeeper/catalog:v0.13.1
    container_name: lakekeeper-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:-change-me-not-secure}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:-lakekeeper}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:-lakekeeper}@postgres:5432/lakekeeper
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
      RUST_LOG: info
    command: ["migrate"]
    networks: [warehouse-net]

  lakekeeper:
    image: *lakekeeper-image
    container_name: lakekeeper
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment: *lakekeeper-env
    command: ["serve"]
    ports:
      - "${LAKEKEEPER_PORT:-8181}:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [warehouse-net]

  # Bootstraps the server and creates the warehouse. The warehouse payload is a
  # template rendered with envsubst so credentials live only in .env.
  lakekeeper-bootstrap:
    image: alpine:3.21
    container_name: lakekeeper-bootstrap
    depends_on:
      lakekeeper:
        condition: service_healthy
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      MINIO_BUCKET: ${MINIO_BUCKET:-warehouse}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-adventure_works_dw}
      S3_REGION: ${ICEBERG_S3_REGION:-us-east-1}
    volumes:
      - ./services/lakekeeper/bootstrap.sh:/bootstrap.sh:ro
      - ./services/lakekeeper/create-warehouse.json.tmpl:/create-warehouse.json.tmpl:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    networks: [warehouse-net]

  # ============================================================
  # Trino — Tier 1, reads Iceberg in place
  # ============================================================
  trino:
    image: trinodb/trino:466
    container_name: trino
    profiles: [engines, all]
    depends_on:
      lakekeeper:
        condition: service_healthy
    ports:
      - "${TRINO_PORT:-8080}:8080"
    environment:
      # Consumed by catalog/iceberg.properties via ${ENV:...} substitution.
      LAKEKEEPER_CATALOG_URI: http://lakekeeper:8181/catalog
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-adventure_works_dw}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
      S3_REGION: ${ICEBERG_S3_REGION:-us-east-1}
    volumes:
      - ./services/trino/catalog:/etc/trino/catalog:ro
    networks: [warehouse-net]

  # ============================================================
  # DuckDB over HTTP — Tier 1, reads Iceberg in place
  # (The BI app can also embed DuckDB in-process; see engines.yaml.)
  # ============================================================
  duckdb-api:
    build:
      context: ./services/duckdb-api
    image: duckdb-api:local
    container_name: duckdb-api
    profiles: [engines, all]
    depends_on:
      lakekeeper:
        condition: service_healthy
    ports:
      - "${DUCKDB_API_PORT:-8000}:8000"
    environment:
      ICEBERG_CATALOG_URI: http://lakekeeper:8181/catalog
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-adventure_works_dw}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-admin12345}
      S3_ENDPOINT: http://minio:9000
      AWS_REGION: ${ICEBERG_S3_REGION:-us-east-1}
    networks: [warehouse-net]

  # ============================================================
  # ClickHouse — Tier 1, reads Iceberg in place via DataLakeCatalog
  # Native protocol is remapped to 9010 on the host; MinIO owns 9000.
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.7.3.19
    container_name: clickhouse
    profiles: [engines, all]
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9010}:9000"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      ICEBERG_CATALOG_URI: http://lakekeeper:8181/catalog
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-adventure_works_dw}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-warehouse}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./services/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./services/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [warehouse-net]

  # Attaches the Iceberg REST catalog. One-shot, idempotent, runs every `up`.
  clickhouse-init:
    image: clickhouse/clickhouse-server:26.7.3.19
    container_name: clickhouse-init
    profiles: [engines, all]
    depends_on:
      clickhouse:
        condition: service_healthy
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_HOST: clickhouse
      ICEBERG_CATALOG_URI: http://lakekeeper:8181/catalog
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-adventure_works_dw}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-warehouse}
    volumes:
      - ./services/clickhouse/attach-catalog.sh:/attach-catalog.sh:ro
    entrypoint: ["bash", "/attach-catalog.sh"]
    networks: [warehouse-net]

volumes:
  minio_data:
  postgres_data:
  clickhouse_data:

networks:
  warehouse-net:
    name: warehouse-net
    driver: bridge
